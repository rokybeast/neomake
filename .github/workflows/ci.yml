name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --verbose

      - name: test
        run: cargo test --workspace --verbose

      - name: smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Confirm the binary runs end-to-end against the cross-platform
          # example using the default Windows shell (pwsh).
          cargo run --quiet --bin neomake -- --config examples/basic.toml run
          cargo run --quiet --bin neomake -- --config examples/basic.toml cache status
