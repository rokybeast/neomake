# A minimal neomake build file written in plain TOML.
#
# Every command here uses `cargo`, which is identical on Linux, macOS,
# and Windows — so the example runs unmodified under either `sh` or
# PowerShell. When the host shell needs to be different (for instance
# to use bash on Windows) set `NEOMAKE_SHELL`, e.g.
# `NEOMAKE_SHELL="bash -c"` or `NEOMAKE_SHELL="cmd /S /C"`.
#
# Run a specific task:
#   neomake run build
#
# Run every task (defaults to the leaves of the DAG):
#   neomake run

[tasks.codegen]
command = "cargo --version"
inputs  = ["schema/**/*.proto"]

[tasks.build]
command = "cargo --version"
deps    = ["codegen"]
inputs  = ["src/**/*.rs", "Cargo.toml"]
env     = { RUST_LOG = "info" }

[tasks.test]
command = "cargo --version"
deps    = ["build"]
