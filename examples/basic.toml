# A minimal neomake build file written in plain TOML.
#
# The `codegen` task has no dependencies and produces `src/generated.rs`.
# The `build` task depends on `codegen` and produces the release binary.
# The `test` task depends on `build` and runs the test suite.
#
# Run a specific task:
#   neomake run build
#
# Run every task (defaults to the leaves of the DAG):
#   neomake run

[tasks.codegen]
command = "mkdir -p src && touch src/generated.rs"
inputs  = ["schema/**/*.proto"]
outputs = ["src/generated.rs"]

[tasks.build]
command = "echo building && touch target-out"
deps    = ["codegen"]
inputs  = ["src/**/*.rs", "Cargo.toml"]
outputs = ["target-out"]
env     = { RUST_LOG = "info" }

[tasks.test]
command = "echo tests pass"
deps    = ["build"]
